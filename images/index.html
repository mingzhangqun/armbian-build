// ── OneDrive helpers ───────────────────────────────────────────────
// Direct download link via OneDrive file ID (from rclone lsjson).
// Format: https://<tenant>-my.sharepoint.com/personal/<user>/_layouts/15/download.aspx?UniqueId=<id>
function odDownloadUrl(fileId) {
  const [driveId, itemId] = fileId.split("#");
  const base = CFG.onedrive.split("/:f:/")[0];
  const user = CFG.onedrive.match(/personal\/([^/]+)/)?.[1];
  if (!base || !user) return "#";
  return base + "/personal/" + user + "/_layouts/15/download.aspx?UniqueId=" + itemId;
}

const BOARD_PAT = /Recomputer-([A-Za-z0-9][A-Za-z0-9-]*?)_/;
const VER_PAT = /^Armbian[^_]*_([^_]+)/;               // Armbian[-unofficial]_26.11.0-trunk_…
const REL_PAT = /_([a-z]+)_vendor_([0-9][\w.-]*?)_/;   // …_resolute_vendor_6.1.172_…
const VARIANT_TITLE = { cli: "CLI", desktop: "Desktop" };
const ROW_LABEL = { img: "Image", ota: "OTA",
                    sha256: "sha256", sha: "sha256", chk: "checksum", txt: "Build info" };
// button groups, rendered with a separator between each pair
const GROUPS = [["img", "sha256", "sha"], ["ota", "chk"], ["txt"]];

function parse(name, size, url) {
  const m = name.match(BOARD_PAT);
  if (!m) return null;
  const board = m[1];
  const variant = name.indexOf("_gnome_desktop") >= 0 ? "desktop"
                : name.indexOf("_minimal") >= 0 ? "cli" : null;
  if (!variant) return null;
  const mode = name.indexOf("_AB_PART") >= 0 ? "ab" : "recovery";
  const crypt = name.indexOf("-crypt") >= 0;
  let kind = null;
  if (name.endsWith(".img.xz.sha256")) kind = "sha256";
  else if (name.endsWith(".img.xz")) kind = "img";
  else if (name.endsWith(".img.sha")) kind = "sha";
  else if (name.endsWith(".img.txt")) kind = "txt";
  else if (name.endsWith("_OTA.tar.gz")) kind = "ota";
  else if (name.endsWith("_OTA.checksums")) kind = "chk";
  else if (name.endsWith(".sha256")) kind = "sha256";
  if (!kind) return null;
  // version metadata, extracted from the self-describing filename:
  // version "26.11.0-trunk" → "26.11.0"; release codename + kernel
  const vm = name.match(VER_PAT);
  const rm = name.match(REL_PAT);
  return { board: board, variant: variant, mode: mode, crypt: crypt,
           kind: kind, name: name, size: size, url: url,
           ver: vm ? vm[1].replace(/-.*$/, "") : "",
           release: rm ? rm[1] : "",
           kernel: rm ? rm[2] : "" };
}

function boardImage(board) {
  return "https://armbian.com/api/v1/images/boards/480/recomputer-"
       + board.replace("-dev-kit", "-devkit") + ".png";
}

// canonical board display order — mirrors the build-images.yml input
// order (rk3576 variants grouped, rk3588 last); unknown boards append
const BOARD_ORDER = ["rk3576-devkit", "rk3576-module-devkit",
                     "rk3576-industrial", "rk3588-devkit"];
const boardRank = b => { const i = BOARD_ORDER.indexOf(b); return i < 0 ? BOARD_ORDER.length : i; };

function group(assets) {
  const map = new Map();
  for (const a of assets || []) {
    const r = parse(a.name, a.size, a.browser_download_url);
    if (!r) continue;
    const key = [r.board, r.variant, r.mode, r.crypt].join("\t");
    if (!map.has(key))
      map.set(key, { board: r.board, variant: r.variant, mode: r.mode,
                     crypt: r.crypt, ver: r.ver, release: r.release,
                     kernel: r.kernel, odboard: (a && a.board) || "", d: {} });
    map.get(key).d[r.kind] = { name: r.name, size: a.size, url: a.browser_download_url };
  }
  const rank = e => (e.variant === "cli" ? 0 : 4)
                  + (e.mode === "recovery" ? 0 : 2) + (e.crypt ? 1 : 0);
  return [...map.values()].sort((x, y) => {
    const bx = boardRank(x.board), by = boardRank(y.board);
    if (bx !== by) return bx - by;
    return x.board < y.board ? -1 : x.board > y.board ? 1 : rank(x) - rank(y);
  });
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// opts: {suppressAb, suppressCrypt, secure} — badge/box-title redundancy
// control and the yellow secure button style
function buildRow(entry, opts, slot) {
  // head: bold variant + gray " - codename - armbian version - kernel" meta
  const head = el("div", "row-head");
  const title = el("span", "row-title", VARIANT_TITLE[entry.variant]);
  if (entry.mode === "ab" && !opts.suppressAb)
    title.appendChild(el("span", "badge ab", "A/B"));
  const meta = [entry.release, entry.ver, entry.kernel].filter(Boolean).join(" - ");
  if (meta) head.appendChild(el("span", "row-meta", "- " + meta));
  head.prepend(title);

  // links: [Image sha256] | [OTA checksum] | [Build info] — groups split
  // by a vertical rule; no sizes; primary buttons go yellow in Secure boxes
  const links = el("div", "row-links");
  for (const group of GROUPS) {
    const present = group.filter(k => entry.d[k]);
    if (!present.length) continue;
    const grp = el("span", "grp");
    for (const kind of present) {
      const v = entry.d[kind];
      const primary = kind === "img" || kind === "ota";
      const cls = primary ? (opts.secure ? "btn secure" : "btn primary") : "btn";
      const a = el("a", cls, ROW_LABEL[kind]);
      // Use direct download link from embedded file ID
      const fileId = v.id;
      a.href = fileId ? odDownloadUrl(fileId) : "#";
      grp.appendChild(a);
    }
    links.appendChild(grp);
  }

  const row = el("div", "row");
  row.append(head, links);
  return row;
}

function buildModeBox(title, subtitle, entries, opts, slot) {
  const box = el("div", "modebox");
  const h3 = el("h3");
  h3.appendChild(document.createTextNode(title));
  if (opts.secure) h3.appendChild(el("span", "badge secure", "Secure"));
  h3.appendChild(el("span", "boxsub", " - " + subtitle));
  box.appendChild(h3);
  for (const entry of entries) box.appendChild(buildRow(entry, opts, slot));
  return box;
}

function buildSection(board, entries, slot) {
  const sec = el("section", "board");

  // photo column: board name ABOVE the photo, large
  const photo = el("div", "photo");
  const cap = el("div", "caption", "reComputer ");
  cap.appendChild(el("span", null, board));
  photo.appendChild(cap);
  const img = document.createElement("img");
  img.src = boardImage(board);
  img.alt = "reComputer " + board;
  img.loading = "lazy";
  img.onerror = () => photo.classList.add("noimg");
  photo.appendChild(img);

  // downloads: mode × secure → up to four boxes, stacked:
  // Recovery / A/B / Recovery Secure / A/B Secure (each only if non-empty)
  const rec  = entries.filter(e => e.mode !== "ab" && !e.crypt);
  const ab   = entries.filter(e => e.mode === "ab" && !e.crypt);
  const recS = entries.filter(e => e.mode !== "ab" && e.crypt);
  const abS  = entries.filter(e => e.mode === "ab" && e.crypt);
  const boxes = el("div", "modeboxes");
  boxes.appendChild(buildModeBox("Recovery", "Single partition", rec,
                                 { suppressAb: false }, slot));
  if (ab.length)
    boxes.appendChild(buildModeBox("A/B", "Dual partition", ab,
                                   { suppressAb: true }, slot));
  if (recS.length)
    boxes.appendChild(buildModeBox("Recovery", "Single partition", recS,
                                   { secure: true }, slot));
  if (abS.length)
    boxes.appendChild(buildModeBox("A/B", "Dual partition", abS,
                                   { suppressAb: true, secure: true }, slot));

  const info = el("div", "info");
  info.append(boxes);

  sec.append(photo, info);
  return sec;
}

function fmtDate(iso) {
  return iso ? iso.slice(0, 10) + " " + iso.slice(11, 16) + " UTC" : "";
}

/* ── slot derivation: /releases list → latest / previous / pre ──────── */
function slotsFrom(list) {
  const fulls = [], pres = [];
  for (const r of list || []) (r.prerelease ? pres : fulls).push(r);
  const latest = fulls[0] || null;      // list is newest-first
  const previous = fulls[1] || null;
  let pre = pres[0] || null;
  // tags are YYMMDD-HHMM → lexicographic compare = chronological.
  // A prerelease older than latest means "already promoted" → hide it.
  if (pre && latest && String(pre.tag_name) <= String(latest.tag_name)) pre = null;
  return { latest: latest, previous: previous, pre: pre };
}

// OneDrive-mode releases carry no binary assets: each build entry
// attaches a small manifest__<board>__<entry>.json asset listing the
// files it shipped. Fetch and merge those; releases without manifest
// assets fall back to their raw asset list (GitHub-assets mode / fork).
// Note: manifest fetches are CORS-limited on github.io; the primary data
// source is the embedded FILES object below (from files-<board>.json).
const MANIFEST_PAT = /^manifest__.*\.json$/;
async function slotAssets(rel) {
  const frags = (rel.assets || []).filter(a => MANIFEST_PAT.test(a.name));
  if (!frags.length) return rel.assets || [];
  const lists = await Promise.all(frags.map(f => fetch(f.browser_download_url)
    .then(r => {
      if (!r.ok) throw new Error("manifest " + f.name + ": HTTP " + r.status);
      return r.json();
    })));
  return [].concat(...lists);
}

// ── OneDrive helpers ───────────────────────────────────────────────
// Direct download link via OneDrive file ID (from rclone lsjson).
// Format: https://<tenant>-my.sharepoint.com/personal/<user>/_layouts/15/download.aspx?UniqueId=<id>
function odDownloadUrl(fileId) {
  const [driveId, itemId] = fileId.split("#");
  const base = CFG.onedrive.split("/:f:/")[0];
  const user = CFG.onedrive.match(/personal\/([^/]+)/)?.[1];
  if (!base || !user) return "#";
  return base + "/personal/" + user + "/_layouts/15/download.aspx?UniqueId=" + itemId;
}

async function splitBoards(rel) {
  const sections = new Map();
  for (const e of group(await slotAssets(rel))) {
    if (!sections.has(e.board)) sections.set(e.board, []);
    sections.get(e.board).push(e);
  }
  return sections;
}

async function buildSlot(rel, kind) {  // kind: "latest" | "pre" | "prev"
  const det = document.createElement("details");
  det.className = "slot";
  det.id = "slot-" + kind;
  det.open = kind === "latest";  // latest starts expanded; others collapsed

  const look = {
    latest: ["badge slotlatest", "✅ Stable"],
    pre:    ["badge slotpre",    "🧪 Pre-release"],
    prev:   ["badge slotprev",   "⏱ Previous"]
  }[kind];
  // No stable yet: pre-release shown in the expanded "latest" slot
  const badge = (kind === "latest" && rel.prerelease)
    ? ["badge slotpre", "🧪 Pre-release"] : look;
  const sum = el("summary");
  sum.appendChild(el("span", badge[0], badge[1]));
  // tag links to the release page on GitHub; interactive elements inside
  // <summary> follow their activation without toggling the details
  const tag = el("a", "tag", rel.tag_name);
  tag.href = "https://github.com/" + CFG.repo + "/releases/tag/" + rel.tag_name;
  tag.title = "GitHub release";
  tag.target = "_blank";   // open in a new tab, don't navigate away
  tag.rel = "noopener";
  sum.appendChild(tag);
  sum.appendChild(el("span", "slotdate", fmtDate(rel.published_at)));
  sum.appendChild(el("span", "chev", "▸"));

  const body = el("div", "slot-body");
  if (kind === "pre" || (kind === "latest" && rel.prerelease))
    body.appendChild(el("div", "slot-note",
      "Build completed on all boards — pending on-device verification before promotion to stable."));
  const slotDir = kind === "latest" ? (rel.prerelease ? "pre-release" : "latest")
                : kind === "pre" ? "pre-release" : "previous";
  for (const [b, es] of await splitBoards(rel))
    body.appendChild(buildSection(b, es, slotDir));

  det.append(sum, body);
  return det;
}

async function boot() {
  const boards = document.getElementById("boards");
  const fallback = document.getElementById("fallback");
  try {
    // /releases lists newest-first, including pre-releases (drafts are
    // invisible to unauthenticated clients — partial builds never show).
    const r = await fetch("https://api.github.com/repos/" + CFG.repo + "/releases?per_page=30",
                          { headers: { Accept: "application/vnd.github+json" } });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = slotsFrom(await r.json());
    if (!s.latest && !s.pre) throw new Error("no releases yet");

    boards.hidden = true;  // all three slots render as collapsible bars below
    const slots = document.getElementById("slots");
    // No stable yet: show pre-release expanded instead of throwing.
    if (!s.latest && s.pre) {
      slots.replaceChildren(await buildSlot(s.pre, "latest"));
    } else {
      slots.replaceChildren(await buildSlot(s.latest, "latest"));
      if (s.pre) slots.appendChild(await buildSlot(s.pre, "pre"));
      if (s.previous) slots.appendChild(await buildSlot(s.previous, "prev"));
    }

    // anchor nav under the title — only slots that exist; clicking also
    // expands a collapsed <details> target
    const nav = document.getElementById("slotnav");
    nav.replaceChildren();
    const navItems = !s.latest
      ? [["latest", "Pre-release"]]  // no stable yet: only pre-release
      : [["latest", "Stable"], ["pre", "Pre-release"], ["prev", "Previous"]];
    for (const [kind, label] of navItems) {
      const rel = kind === "prev" ? s.previous : s[kind];  // field is "previous"
      if (!rel) continue;
      const a = el("a", kind, label);   // class latest|pre|prev → pill color
      a.href = "#slot-" + kind;
      a.onclick = () => { const d = document.getElementById("slot-" + kind);
                          if (d) d.open = true; };
      nav.appendChild(a);
    }
    nav.hidden = nav.children.length === 0;
  } catch (e) {
    boards.hidden = true; fallback.hidden = false;
  }
}

if (typeof document !== "undefined") boot();
